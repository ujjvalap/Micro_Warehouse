
# Spring Boot Database & Application Configuration
# Quick-Commerce Micro-Warehouse Inventory & Fulfillment Hub

server.port=5000
spring.application.name=Micro-Warehouse

# Database Connection (MySQL 8.x)
spring.datasource.url=jdbc:mysql://localhost:3306/micro_warehouse?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema & Data Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# Logging Configuration
logging.level.org.warehouse=INFO
logging.level.org.springframework.jdbc.core=INFO
logging.level.root=WARN
