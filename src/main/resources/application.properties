# ====================================================================
# Spring Mini Hackathon 2026: Micro-Warehouse Inventory & Fulfillment Hub
# Spring Boot & Database Configuration
# ====================================================================

# MySQL 8.x DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/micro_warehouse?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=MicroWarehouseHikariCP

# Automatic Database Initialization with schema.sql and data.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# Interactive Console CLI Flag (enabled for interactive runs, disabled during automated test suites)
interactive.cli=true

# Logging Configuration
logging.level.com.warehouse=INFO
logging.level.org.springframework.jdbc.core=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n